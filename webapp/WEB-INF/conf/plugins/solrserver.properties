# relative path to the solr conf directory
#copy WEB-INF/plugins/solrserver/solr directory to a directory of your choice (<solr_directory_path>) then set solrserver.solr.home property accordingly
solrserver.solr.home=<solr_directory_path>/solrserver/solr
#example :
#solrserver.solr.home=/home/osboxes/env/solr-plugin-solrserver/solrserver/solr

##
# if no asbolute path is configure, the relative path is used
#
# absolute path to where solR is going to store indexes
# absolute path to data directory must be set
solrserver.solr.absolute.data=<solr_directory_path>/solrserver/solr/collection1/data
#example :
#solrserver.solr.absolute.data=/home/osboxes/env/solr-plugin-solrserver/solrserver/solr/collection1/data
# relative path to where solR is going to store indexes
solrserver.solr.relative.data=/home/osboxes/env/solr-plugin-solrserver/solrserver/solr/collection1/data

# must match the filter declaration path in solrserver.xml
solrserver.solr.uri=/solrserver/solr
solrserver.solr.uri.select=/solrserver/solr/select
solrserver.solr.uri.update=/solrserver/solr/update
solrserver.solr.uri.autoComplete=/solrserver/solr/suggest
solrserver.solr.host.client=127.0.0.1
